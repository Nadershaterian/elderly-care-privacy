<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<meta name="description" content="How Everlight Care for iPhone handles your information: what it keeps on your iPhone, and the few things that can leave it.">
<style>
  /* Shaterian's policy page, in Elderly Care's sky blue. */
  :root {
    --ink: #16181d;
    --muted: #5b6270;
    --rule: #e2e5ea;
    --paper: #ffffff;
    --soft: #f7f8fa;
    --accent: #1f6585;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e8eaee; --muted: #a2a9b6; --rule: #2a2e37;
      --paper: #0f1115; --soft: #161920; --accent: #82d0f4;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter,
          Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 46rem; margin: 0 auto; padding: 3rem 1.25rem 5rem; }
  h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 .5rem; letter-spacing: -.02em; }
  h2 {
    font-size: 1.25rem; margin: 2.75rem 0 .75rem; letter-spacing: -.01em;
    padding-top: 1.5rem; border-top: 1px solid var(--rule);
  }
  h3 { font-size: 1.02rem; margin: 1.75rem 0 .5rem; }
  p, li { color: var(--ink); }
  .meta { color: var(--muted); font-size: .95rem; margin: 0 0 1rem; }
  ul, ol { padding-left: 1.2rem; }
  li { margin: .35rem 0; }
  strong { font-weight: 650; }
  a { color: var(--accent); }
  .tablewrap { overflow-x: auto; margin: 1rem 0; }
  table { border-collapse: collapse; width: 100%; min-width: 30rem; font-size: .95rem; }
  th, td { text-align: left; vertical-align: top; padding: .6rem .7rem; border-bottom: 1px solid var(--rule); }
  th { font-weight: 650; color: var(--muted); font-size: .82rem; text-transform: uppercase; letter-spacing: .04em; }
  footer { margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--rule); color: var(--muted); font-size: .95rem; }
</style>
</head>
<body>
<main class="wrap">
{{ content }}
<footer>School Fab Lab · Everlight Care for iPhone</footer>
</main>
</body>
</html>
